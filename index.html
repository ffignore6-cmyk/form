<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .form-container {
      width: 565px;
      min-height: 310px;
      border: 2px solid #222;
      background: #fff;
      padding: 48px 82px 35px;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 27px;
    }

    .label-box,
    .input-box {
      width: 170px;
      height: 45px;
      border: 2px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label-box {
      font-size: 20px;
      white-space: nowrap;
    }

    .input-box input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 10px;
      text-align: center;
      font-size: 17px;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 63px;
    }

    button {
      width: 170px;
      height: 45px;
      border: 2px solid #222;
      background: #fff;
      color: #222;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #222;
      color: #fff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 18px;
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    @media (max-width: 650px) {
      .form-container {
        width: 92%;
        padding: 30px 20px;
      }

      .form-row {
        flex-direction: column;
        gap: 10px;
        margin-bottom: 25px;
      }

      .label-box,
      .input-box {
        width: 100%;
      }

      .button-wrap {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">
    <form id="contactForm">

      <div class="form-row">
        <div class="label-box">Name</div>

        <div class="input-box">
          <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="name"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="label-box">Mobile no</div>

        <div class="input-box">
          <input
            type="tel"
            id="mobile"
            name="mobile"
            required
            autocomplete="tel"
          >
        </div>
      </div>

      <div class="button-wrap">
        <button type="submit" id="saveBtn">Save</button>
      </div>

      <div id="message"></div>

    </form>
  </div>

  <script>
    // ==========================================
    // SUPABASE CONFIG
    // Yahan apni Supabase details paste karein
    // ==========================================

    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "sb_publishable_OjZCUrQxua3QQ6boXikwjw_Ci8U1WDP";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("contactForm");
    const saveBtn = document.getElementById("saveBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();

      if (!name || !mobile) {
        showMessage("Please fill all fields.", "error");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";
      showMessage("", "");

      try {
        const { error } = await supabaseClient
          .from("contacts")
          .insert([
            {
              name: name,
              mobile_no: mobile
            }
          ]);

        if (error) {
          throw error;
        }

        form.reset();
        showMessage("Data saved successfully!", "success");

      } catch (error) {
        console.error(error);
        showMessage(
          "Data save nahi hua. Supabase settings check karein.",
          "error"
        );
      }

      saveBtn.disabled = false;
      saveBtn.textContent = "Save";
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }
  </script>

</body>
</html>
